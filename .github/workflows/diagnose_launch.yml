name: "Diagnose alpha launch"

# Temporary: installs the published alpha DMG on a macOS runner, launches it and collects why it exits.
on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/diagnose_launch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - name: Download and install the DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          sw_vers
          gh release download v2.8.0-alpha.1 --repo "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir "$RUNNER_TEMP"
          hdiutil attach "$RUNNER_TEMP"/boringNotch-2.8.0-alpha.1.dmg -nobrowse -mountpoint /Volumes/bn
          ls -la /Volumes/bn
          cp -R "/Volumes/bn/Boring Notch.app" /Applications/
          xattr -dr com.apple.quarantine "/Applications/Boring Notch.app" || true
          ls -la "/Applications/Boring Notch.app/Contents/MacOS"

      - name: Signing details
        run: |
          APP="/Applications/Boring Notch.app"
          codesign -dvvv "$APP" 2>&1 || true
          echo "--- entitlements"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
          echo "--- verify"
          codesign --verify --deep --strict --verbose=4 "$APP" 2>&1 || true
          echo "--- spctl"
          spctl -a -vv "$APP" 2>&1 || true
          echo "--- nested code"
          find "$APP/Contents" \( -name "*.framework" -o -name "*.xpc" -o -name "*.app" \) -maxdepth 3 -print -exec sh -c 'codesign -dv "$1" 2>&1 | grep -E "Identifier|TeamIdentifier|Signature|flags"' _ {} \;
          echo "--- Info.plist"
          plutil -p "$APP/Contents/Info.plist"

      - name: Launch the binary directly
        run: |
          APP="/Applications/Boring Notch.app"
          BIN="$APP/Contents/MacOS/Boring Notch"
          START="$(date '+%Y-%m-%d %H:%M:%S')"
          echo "$START" > "$RUNNER_TEMP/start"
          ( "$BIN" > "$RUNNER_TEMP/stdout.txt" 2>&1; echo "exit status: $?" >> "$RUNNER_TEMP/stdout.txt" ) &
          sleep 25
          echo "--- still running?"
          pgrep -fl "Boring Notch" || echo "not running"
          echo "--- output"
          cat "$RUNNER_TEMP/stdout.txt" | head -200
          pkill -f "Boring Notch" || true

      - name: Launch with open (like Finder)
        run: |
          open -a "/Applications/Boring Notch.app" 2>&1 || echo "open failed: $?"
          sleep 15
          pgrep -fl "Boring Notch" || echo "not running after open"
          pkill -f "Boring Notch" || true

      - name: Crash reports and logs
        if: always()
        run: |
          START="$(cat "$RUNNER_TEMP/start" 2>/dev/null || date -v-5M '+%Y-%m-%d %H:%M:%S')"
          for d in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
            ls -la "$d" 2>/dev/null | grep -i boring || true
            for f in "$d"/*oring*; do
              [ -f "$f" ] || continue
              echo "===== $f"
              head -c 12000 "$f"
              echo
            done
          done
          echo "===== system log"
          log show --start "$START" --style compact \
            --predicate 'process CONTAINS "Boring Notch" OR eventMessage CONTAINS "Boring Notch" OR eventMessage CONTAINS "theboringteam" OR process == "amfid" OR process == "taskgated" OR process == "syspolicyd"' \
            2>/dev/null | grep -v "^Timestamp" | tail -n 300
